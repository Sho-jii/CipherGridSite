# Render Blueprint Specification for CipherGrid Landing & Download Website
# Documentation: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: ciphergrid-site
    runtime: static
    buildCommand: npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: VITE_APP_VERSION
        value: "1.0.0"
      - key: VITE_APK_FILENAME
        value: "CipherGrid-v1.0.0.apk"
      - key: VITE_APK_FILE_SIZE
        value: "53.5 MB"
      - key: VITE_APK_DIRECT_URL
        value: "https://github.com/Sho-jii/CipherGrid/releases/download/V1/CipherGrid-v1.0.0.apk"
      - key: VITE_APK_SHA256
        value: "8eb1940f5abde60fb2073241eda03e6bac921bf9eecbc6b07d89a96992e53e03"
      - key: VITE_MIN_ANDROID
        value: "Android 7.0 (Nougat) or higher"
      - key: VITE_MIN_API
        value: "24"
      - key: VITE_REPO_URL
        value: "https://github.com/Sho-jii/CipherGrid"
      - key: VITE_RELEASES_URL
        value: "https://github.com/Sho-jii/CipherGrid/releases/tag/V1"
      - key: VITE_ACTIONS_URL
        value: "https://github.com/Sho-jii/CipherGrid/actions"
